<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

<div class="envelope" id="envelope">

    <!-- Badan amplop -->
    <div class="envelope-body">

        <!-- Surat di dalam amplop -->
        <div class="letter">
            <h2></h2>
            <p></p>
            <p></p>
        </div>

        <!-- Lipatan kiri -->
        <div class="fold-left"></div>

        <!-- Lipatan kanan -->
        <div class="fold-right"></div>

        <!-- Lipatan bawah -->
        <div class="fold-bottom"></div>

    </div>

    <!-- Tutup amplop -->
    <div class="flap"></div>

    <!-- Segel -->
    <div class="seal">
        <span>✦</span>
    </div>

    <!-- Tulisan -->
    <div class="open-text">
        Buka Amplop
    </div>

</div>


        <p class="instruction">
            ✉️Klik amplop untuk membuka isi surat Chantika✉️
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
